<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Page not found · Trung Truong</title>
	<meta name="robots" content="noindex" />
	<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=JetBrains+Mono:wght@400;500&display=swap" />
	<link rel="stylesheet" href="/assets/css/style.css" />
	<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
	<style>
		.nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding-block: 48px; }
		.nf h1 { font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 750; margin: 12px 0 16px; }
		.nf img { margin: 32px auto 0; border: 1.5px solid var(--ink); border-radius: 2px; max-width: min(420px, 100%); }
		.nf .actions { justify-content: center; }
	</style>
</head>
<body>
	<main class="nf wrap">
		<div>
			<p class="eyebrow">Error 404</p>
			<h1>This page doesn't exist.</h1>
			<p>The link may be old, or the page may have moved.</p>
			<div class="actions"><a class="btn btn--primary" href="/">Back to the main page</a></div>
			<picture>
				<source srcset="/images/404.webp" type="image/webp" />
				<img src="/images/404.jpg" width="600" height="480" alt="Cartoon police officer in sunglasses with the caption: Alright people. Move along. There's nothing to see here." />
			</picture>
		</div>
	</main>
</body>
</html>
